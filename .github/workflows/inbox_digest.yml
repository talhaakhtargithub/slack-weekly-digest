name: Inbox Digest

# Daily combined "which emails came" digest across the campaign Gmail accounts,
# with an LLM (NVIDIA) summary + intent per reply. Delivered to Slack AND email.
# Also triages the inbox: marks useless mail read, keeps real leads unread.
# Runs in this PUBLIC repo -> free unlimited Actions minutes.

on:
  schedule:
    - cron: '30 6 * * *'      # daily ~06:30 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back to include'
        default: '1'
      replies_only:
        description: '1 = only real replies (hide bounces/auto)'
        default: '0'
      triage:
        description: '1 = mark useless mail read / keep leads unread'
        default: '1'
      llm_limit:
        description: 'Max replies to summarize+classify with NVIDIA per run'
        default: '40'

permissions:
  contents: read

concurrency:
  group: inbox-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run digest -> Slack + email + triage
        env:
          DIGEST_ACCOUNTS_JSON: ${{ secrets.DIGEST_ACCOUNTS_JSON }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          NVIDIA_MODEL_FALLBACK: meta/llama-3.1-70b-instruct
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.DIGEST_SLACK_CHANNEL }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DAYS: ${{ github.event.inputs.days || '1' }}
          REPLIES_ONLY: ${{ github.event.inputs.replies_only || '0' }}
          TRIAGE: ${{ github.event.inputs.triage || '1' }}
          LLM_LIMIT: ${{ github.event.inputs.llm_limit || '40' }}
        run: |
          EXTRA=""
          [ "$REPLIES_ONLY" = "1" ] && EXTRA="$EXTRA --replies-only"
          [ "$TRIAGE" != "0" ] && EXTRA="$EXTRA --triage"
          python inbox_digest.py --days "$DAYS" --llm-limit "$LLM_LIMIT" $EXTRA --slack-bot --email
